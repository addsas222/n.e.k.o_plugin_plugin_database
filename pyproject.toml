[project]
name = "plugin_database"
version = "0.2.1"
description = "N.E.K.O unified database layer: SQLite/PostgreSQL/MySQL/MongoDB/Neo4j/Redis adapters plus generic SQLAlchemy/ODBC/HTTP drivers, with hot_knowledge table"
# 收紧到 <3.12：vendor 里的 vec0.dll / 扩展二进制是 cp311-win_amd64，
# 在 3.12+ 上 ABI 不匹配，vec0 会静默失效（实测 3.14 下 no such module: vec0）。
requires-python = ">=3.11,<3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "aiomysql>=0.2",
    "pymysql>=1.1",
    "motor>=3.4",
    "pymongo>=4.6",
    "sqlite-vec>=0.1.6",
    "neo4j>=5.28,<7",
    # 5.0.1 起才有 aclose()（close() 会发弃用警告）
    "redis>=5.0.1",
    # 通用驱动：driver = "sqlalchemy" / "odbc"（http 只用标准库）。
    # 方言包/其它 DBAPI（duckdb、oracledb、clickhouse-sqlalchemy...）不进依赖，装进 [database] extra_paths。
    "sqlalchemy>=2.0",
    "pyodbc>=5.1",
]

# 打包时排除运行期状态目录。宿主会在插件目录下生成 config/（从 config.example.toml
# 复制）与 data/（真实数据库文件），它们已在 .gitignore 里，但打包器不读 gitignore，
# 只认这里 —— 不排除的话本地出包会把当前数据库塞进 zip，且 *.db-shm 是全零文件，
# 压缩比远超 200:1 的门禁上限，check --release 会直接失败。
[tool.neko.build]
exclude_dirs = ["data", "config", "cache"]

[tool.pytest.ini_options]

# 警告一律按错误处理。两个显式豁免（均为宿主/环境所有，非插件缺陷）：
# 1. plugin.settings 的 DeprecationWarning：宿主 SDK 导入链自带
# 2. PytestUnraisableExceptionWarning：Windows Proactor 事件循环 GC 时序，
#    宿主自带 lifekit 套件在本机同样触发（证据见交付说明）
filterwarnings = [
    "error",
    "ignore:plugin.settings.PLUGIN_CONFIG_ROOT:DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

asyncio_mode = "auto"
testpaths = ["tests"]
